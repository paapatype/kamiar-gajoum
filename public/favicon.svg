<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- KG monogram: white "KG" inside an oval ring on a rounded black tile.
       White ring + letters keep it legible on both light and dark browser tabs. -->
  <rect width="64" height="64" rx="13" fill="#0a0a0a"/>
  <ellipse cx="32" cy="32" rx="24" ry="18" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="500"
        font-size="21" letter-spacing="0.5" fill="#ffffff">KG</text>
</svg>
