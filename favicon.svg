<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- KG circular monogram. Dark fill so it reads on light tabs; white ring
       and letters keep it visible on dark tabs too. -->
  <circle cx="32" cy="32" r="31.5" fill="#111111"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <text x="32" y="33.5" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="400"
        font-size="23" letter-spacing="0.5" fill="#ffffff">KG</text>
</svg>
